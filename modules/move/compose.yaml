services:
  module:
    build:
      context: ../../module
      args:
        CMD: move
    environment:
      MMAPS_DIR: /mmaps
      MAPS_DIR: /maps
      VMAPS_DIR: /vmaps
    volumes:
      - ../../logs:/logs
      - ../../assets/mmaps:/mmaps:ro
      - ../../assets/maps:/maps:ro
      - ../../assets/vmaps:/vmaps:ro
