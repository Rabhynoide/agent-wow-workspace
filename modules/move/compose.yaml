services:
  module:
    build:
      context: ../../module
      args:
        CMD: move
    environment:
      MMAPS_DIR: /mmaps
      MAPS_DIR: /maps
      VMAPS_DIR: /vmaps
      LEARN_DIR: /learn
      ROADS_DIR: /roads
    volumes:
      - ../../logs:/logs
      - ../../journal/learn:/learn:ro
      - ../../assets/mmaps:/mmaps:ro
      - ../../assets/maps:/maps:ro
      - ../../assets/vmaps:/vmaps:ro
      - ../../assets/roads:/roads:ro
