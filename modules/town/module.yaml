api_version: 1
enabled: true
description: Vendor actions (sell junk and useless items by rule)
requires:
  - state
  - world
  - move
compose:
  file: compose.yaml
  service: module
grpc:
  descriptor_set: module.pb
rpc:
  sell_junk: /wowagent.town.v1.Town/SellJunk
  repair: /wowagent.town.v1.Town/Repair
lifecycle:
  before_logout: /wowagent.town.v1.Town/BeforeLogout
