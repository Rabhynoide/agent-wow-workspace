api_version: 1
enabled: true
description: Quest accept/turn-in and object interaction
requires:
  - state
compose:
  file: compose.yaml
  service: module
grpc:
  descriptor_set: module.pb
rpc:
  accept: /wowagent.quest.v1.Quest/Accept
  turnin: /wowagent.quest.v1.Quest/TurnIn
  use: /wowagent.quest.v1.Quest/Use
packets:
  SMSG_LOOT_RESPONSE: /wowagent.quest.v1.Quest/OnPacket
lifecycle:
  before_logout: /wowagent.quest.v1.Quest/BeforeLogout
