respec_notes: >-
  Niveau 25 : respec obligatoire si Improved Thunder Clap a été pris (12-14).
  Retirer ces 3 points pour atteindre Taste for Blood. Le guide ne détaille pas
  la répartition exacte après respec ; garder le reste de l'ordre ci-dessus.

key_abilities:
  - { name: "Battle Shout", level: null, use: "Buff à maintenir en permanence" }
  - { name: "Charge", level: null, use: "Ouverture, génère de la rage" }
  - { name: "Heroic Strike", level: null, use: "Dépense de rage (tôt) ; plus tard seulement en excédent" }
  - { name: "Bloodrage", level: null, use: "Rage hors combat entre deux mobs" }
  - { name: "Rend", level: 4, use: "DoT d'ouverture ; active Taste for Blood (25+)" }
  - { name: "Thunder Clap", level: 6, use: "Gros dégâts au début, AoE ensuite" }
  - { name: "Victory Rush", level: 6, use: "Après un coup fatal, avant expiration du proc" }
  - { name: "Defensive Stance", level: 10, use: "Via quête de classe" }
  - { name: "Overpower", level: 12, use: "Sur esquive ou proc Taste for Blood ; cœur de la rotation" }
  - { name: "Execute", level: 24, use: "Cible basse vie, ou proc Sudden Death (54+)" }
  - { name: "Sweeping Strikes", level: 30, use: "Talent ; multi-cibles" }
  - { name: "Berserker Stance", level: 30, use: "Via quête de classe" }
  - { name: "Slam", level: null, use: "Sort principal dès Improved Slam (41) ; 15 rage, à l'arrêt" }
  - { name: "Mortal Strike", level: 42, use: "Talent ; 30 rage, si rage haute ou en mouvement" }
  - { name: "Bladestorm", level: 60, use: "Talent ; mono et AoE, combiner avec Sweeping Strikes" }

rotation_solo:
  - "Hors combat : Battle Shout actif ; Bloodrage entre deux mobs pour garder la rage"
  - "Ouvrir avec Charge"
  - "Rend si la cible vivra la majeure partie du DoT"
  - "Overpower sur esquive (12+) ou proc Taste for Blood (25+) ; ne jamais laisser expirer"
  - "Victory Rush avant expiration du proc"
  - "Execute sur cible basse vie (24+) ou proc Sudden Death (54+)"
  - "Slam si immobile (41+)"
  - "Mortal Strike si rage haute ou en mouvement (42+)"
  - "Thunder Clap : prioritaire en bas niveau ; ensuite seulement avec rage en trop ou plusieurs ennemis"
  - "Heroic Strike : vider la rage avant 41 ; ensuite uniquement en gros excédent"
  - "Multi-mobs : Sweeping Strikes (30+) ; à 60+, Bladestorm prêt => puller plusieurs mobs et combiner Sweeping Strikes + Bladestorm"

downtime: >-
  First Aid quasi indispensable (soin sans ressource, apprendre tôt).
  Bloodrage entre deux mobs pour éviter la décroissance de la rage.
  Improved Charge fournit de la rage d'ouverture. Rien d'autre précisé par le guide.

stat_priority: null

gear_notes:
  - "Arme à deux mains (Two-Handed Weapon Specialization) ; polearm/hache idéale pour Poleaxe Specialization"
  - "Mining + Engineering : casques et bijoux fabriqués utiles en leveling, Engineering voulu au 80"
  - "Sinon, professions déconseillées si objectif = vitesse max"

glyphs:
  major: ["Glyph of Rending", "Glyph of Victory Rush"]
  minor: ["Glyph of Battle", "Glyph of Bloodrage", "Glyph of Enduring Victory"]

class_quests:
  - { level: 10, unlocks: "Defensive Stance", quests: { Human: "A Warrior's Training (1638)", Dwarf_Gnome: "Muren Stormpike (1679)", NightElf: "Elanaria (1684)", Orc_Troll_Tauren: "Veteran Uzzek (1505)", Undead: "Speak with Dillinger (1818)" } }
  - { level: 30, unlocks: "Berserker Stance", quests: { all: "The Islander (1718)" }, note: "Prise auprès du maître de classe" }

training:
  max_rank: ["Battle Shout", "Rend", "Thunder Clap", "Execute", "Slam", "Mortal Strike"]
  train_asap_single_rank: ["Victory Rush", "Hamstring", "Bloodrage", "Overpower", "Disarm", "Retaliation", "Intimidating Shout", "Berserker Rage", "Pummel", "Recklessness", "Shattering Throw", "Enraged Regeneration"]
  low_priority: ["Heroic Strike", "Cleave", "Charge"]   # gains de rang faibles, si or en trop
  skip: ["Shield Bash", "Demoralizing Shout", "Revenge", "Mocking Blow", "Shield Block", "Challenging Shout", "Shield Wall", "Whirlwind", "Shield Slam", "Spell Reflection", "Commanding Shout", "Intervene"]

pitfalls:
  - "Oublier le respec au 25 (Improved Thunder Clap bloque Taste for Blood)"
  - "Laisser expirer les procs Taste for Blood / Victory Rush"
  - "Spammer Mortal Strike à l'arrêt : Slam est plus rentable en rage"
  - "Continuer à vider la rage en Heroic Strike après 41"
  - "Rend sur des mobs qui meurent trop vite"
  - "Dépenser l'or sur les sorts de tank/défensifs (liste training.skip)"

source: https://www.icy-veins.com/wotlk-classic/warrior-leveling-guide
