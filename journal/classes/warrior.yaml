class: warrior
recommended_leveling_spec: Arms
alternatives:
  - { spec: Fury, why: "Gros dégâts mais très dépendant de l'équipement ; déconseillé si sous-équipé." }
  - { spec: Protection, why: "Pour leveler en groupe / donjons en rôle tank." }

