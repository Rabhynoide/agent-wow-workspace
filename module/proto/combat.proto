syntax = "proto3";

package wowagent.combat.v1;
option go_package = "wowagent/gen/combatv1;combatv1";

import "api/module/v1/session.proto";
import "google/protobuf/empty.proto";

message KillRequest {
  // Creature entry to hunt.
  uint32 entry = 1;
  // Number of kills wanted (0 = until the item goal is reached).
  uint32 count = 2;
  // Stop when the bags hold item_count of item_entry.
  uint32 item_entry = 3;
  uint32 item_count = 4;
  // Search radius in yards (default 80).
  float radius = 5;
  // Job time limit in seconds (default 600).
  uint32 max_s = 6;
  // Seconds to block before returning the current status (default 20, max 25).
  uint32 wait_s = 7;
  bool no_loot = 8;
  // Monsters (weighted by level) we accept to fight at once; 0 = from the learned fights: the expected
  // loss of the target and its adds must leave 35 % of health (xpscore.PullLoss). A target with more
  // around it is body pulled or skipped.
  float max_pull = 9;
  // Try to body pull a crowded target alone (experimental: see BACKLOG); otherwise crowded targets
  // are skipped for a while.
  bool body_pull = 10;
  // Fight this very unit (count 1) instead of picking one of the entry.
  uint64 guid = 11;
}

message RestRequest {
  uint32 wait_s = 1;
}

message StatusRequest {
  uint32 wait_s = 1;
}

message CombatStatus {
  // idle | running | done | failed | stopped
  string state = 1;
  string reason = 2;
  uint32 kills = 3;
  uint32 items = 4;
  uint32 hp_pct = 5;
  uint32 mana_pct = 6;
  uint32 elapsed_s = 7;
  string doing = 8;
  uint64 coin = 9;
  // Places we fled from a short while ago (flee.go): grind and hunts keep away from them.
  repeated Zone avoid = 10;
  // Flights during this job: a kill job ends at the first one (too dangerous for now), a defend goes on.
  uint32 fled = 11;
}

message Zone {
  uint32 map = 1;
  float x = 2;
  float y = 3;
  float radius = 4;
  // Seconds before the zone is forgotten.
  uint32 left_s = 5;
}

service Combat {
  rpc Kill(KillRequest) returns (CombatStatus);
  rpc Rest(RestRequest) returns (CombatStatus);
  rpc Status(StatusRequest) returns (CombatStatus);
  rpc Stop(google.protobuf.Empty) returns (CombatStatus);
  // Fights whatever attacks us until nothing has for 4 s (used by auto's idle guard).
  rpc Defend(StatusRequest) returns (CombatStatus);
  rpc OnPacket(agentwow.module.v1.WorldPacket) returns (google.protobuf.Empty);
  rpc BeforeLogout(google.protobuf.Empty) returns (google.protobuf.Empty);
}
