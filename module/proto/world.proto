syntax = "proto3";

package wowagent.world.v1;
option go_package = "wowagent/gen/worldv1;worldv1";

import "google/protobuf/empty.proto";

message FindNpcRequest {
  // Substring of the creature name, or empty to search by entry.
  string name = 1;
  uint32 entry = 2;
  // Only spawns on this map when map_filter is set.
  bool map_filter = 3;
  uint32 map = 4;
  // If set, spawns are sorted by distance to (x, y) and limited by radius when > 0.
  float x = 5;
  float y = 6;
  float radius = 7;
  uint32 max = 8;
  // Keep only NPCs whose npcflag intersects this mask (vendor 128, repair 4096, innkeeper 65536, quest giver 2...).
  uint32 npc_flags = 9;
  // Keep only vendors selling an item whose first spell has this category (11 food, 59 drink) and
  // whose required level is at most sells_max_level.
  uint32 sells_spell_category = 10;
  uint32 sells_max_level = 11;
}

message Spawn {
  uint32 entry = 1;
  string name = 2;
  uint32 min_level = 3;
  uint32 max_level = 4;
  uint32 npc_flags = 5;
  uint32 faction = 6;
  uint32 map = 7;
  float x = 8;
  float y = 9;
  float z = 10;
  float dist = 11;
  // creature_template.rank: 0 normal, 1 elite, 2 rare elite, 3 boss, 4 rare.
  uint32 rank = 12;
  // creature_template.HealthModifier, DamageModifier, BaseAttackTime (ms); 0 for game objects and
  // find_npc.
  float health_mod = 13;
  float damage_mod = 14;
  uint32 attack_ms = 15;
}

message FindNpcResponse {
  repeated Spawn spawns = 1;
}

message QuestInfoRequest {
  uint32 id = 1;
  string title = 2;
}

message QuestNpc {
  uint32 entry = 1;
  string name = 2;
  uint32 map = 3;
  float x = 4;
  float y = 5;
  float z = 6;
}

message QuestObjective {
  // "kill", "item", "gameobject" or "explore".
  string kind = 1;
  uint32 entry = 2;
  string name = 3;
  uint32 count = 4;
  // kill/gameobject: index of the quest log counter (RequiredNpcOrGo slot, 0-based).
  uint32 counter = 5;
  // kill: spawned creatures whose kill also gives this credit (creature_template KillCredit1/2),
  // filled when the entry itself is never spawned.
  repeated uint32 credit_from = 6;
  // explore (entry = area trigger id): trigger position and radius. Any trigger of the quest
  // completes it; the client must send CMSG_AREATRIGGER inside it (quest.explore).
  uint32 map = 7;
  float x = 8;
  float y = 9;
  float z = 10;
  float radius = 11;
  // kill/gameobject credited by a spell (quest special flag 0x20): the quest item to use, its
  // spell, and what the spell must hit (use_on_kind "creature" or "gameobject").
  uint32 use_item = 12;
  uint32 use_spell = 13;
  repeated uint32 use_on = 14;
  string use_on_kind = 15;
}

message ItemStat {
  uint32 type = 1;
  int32 value = 2;
}

message QuestInfo {
  uint32 id = 1;
  string title = 2;
  uint32 level = 3;
  uint32 min_level = 4;
  int32 zone_or_sort = 5;
  uint32 prev_quest = 6;
  uint32 next_quest = 7;
  uint32 reward_xp_id = 8;
  int32 reward_money = 9;
  repeated QuestObjective objectives = 10;
  repeated QuestNpc starters = 11;
  repeated QuestNpc enders = 12;
  string objectives_text = 13;
  // Items offered as a choice at turn-in (index = reward argument of quest.turnin).
  repeated uint32 reward_choices = 14;
  // quest_template_addon.SpecialFlags (0x2 exploration or event, 0x20 spell cast on a target).
  uint32 special_flags = 15;
  // Items always given at turn-in (RewardItem1-4).
  repeated uint32 reward_items = 16;
}

message QuestInfoResponse {
  repeated QuestInfo quests = 1;
}

message QuestsForNpcRequest {
  uint32 entry = 1;
}

message QuestRef {
  uint32 id = 1;
  string title = 2;
  uint32 level = 3;
  uint32 min_level = 4;
  // "start" or "end".
  string role = 5;
}

message QuestsForNpcResponse {
  repeated QuestRef quests = 1;
}

message SpawnsRequest {
  uint32 entry = 1;
  uint32 map = 2;
  float x = 3;
  float y = 4;
  float radius = 5;
  uint32 max = 6;
  // "creature" (default) or "gameobject".
  string kind = 7;
}

message SpawnsResponse {
  repeated Spawn spawns = 1;
}

message ItemInfoRequest {
  uint32 entry = 1;
  string name = 2;
}

message ItemInfo {
  uint32 entry = 1;
  string name = 2;
  uint32 quality = 3;
  uint32 item_level = 4;
  uint32 required_level = 5;
  uint32 class = 6;
  uint32 subclass = 7;
  uint32 inventory_type = 8;
  uint32 sell_price = 9;
  uint32 buy_price = 10;
  uint32 stackable = 11;
  uint32 armor = 12;
  // Weapon damage per second (first damage range).
  float dps = 13;
  repeated ItemStat stats = 14;
  // -1 = any class/race, else bitmask (1 << (id - 1)).
  int32 allowable_class = 15;
  int32 allowable_race = 16;
  // First spell category: 11 = food, 59 = drink.
  uint32 spell_category = 17;
  // 0 none, 1 bind on pickup, 2 bind on equip, 3 bind on use, 4+ quest.
  uint32 bonding = 18;
  // On-use spell (spellid_1 when spelltrigger_1 = 0), sent with CMSG_USE_ITEM.
  uint32 use_spell = 19;
  // ItemDisplayInfo.dbc id (icon), first damage range and weapon speed (tooltips).
  uint32 display_id = 20;
  float dmg_min = 21;
  float dmg_max = 22;
  uint32 delay_ms = 23;
  // Slots of a bag (0 for other items).
  uint32 container_slots = 24;
}

message ItemInfoResponse {
  repeated ItemInfo items = 1;
}

message CreatureInfoRequest {
  uint32 entry = 1;
}

message CreatureInfo {
  uint32 entry = 1;
  string name = 2;
  uint32 min_level = 3;
  uint32 max_level = 4;
  uint32 faction = 5;
  uint32 npc_flags = 6;
  uint32 rank = 7;
  uint32 type = 8;
  uint32 skinning_loot = 9;
  uint32 loot_id = 10;
  // Base aggro radius (creature_template.detection_range, 20 by default, 18 in Elwynn): the aggro
  // range is this minus (player level - creature level), 5 to 45 (Creature::GetAggroRange).
  float detection_range = 11;
}

message ItemSourcesRequest {
  uint32 entry = 1;
}

message ItemSource {
  // "creature" or "gameobject".
  string kind = 1;
  uint32 entry = 2;
  string name = 3;
  uint32 min_level = 4;
  uint32 max_level = 5;
  float chance = 6;
}

message ItemSourcesResponse {
  repeated ItemSource sources = 1;
}

message ClassTrainersRequest {
  uint32 class_id = 1;
  uint32 map = 2;
  float x = 3;
  float y = 4;
  // Default 3.
  uint32 max = 5;
}

message TrainerSpell {
  uint32 spell = 1;
  uint32 cost = 2;
  uint32 req_level = 3;
  repeated uint32 req_ability = 4;
}

message ClassTrainer {
  uint32 entry = 1;
  string name = 2;
  uint32 map = 3;
  float x = 4;
  float y = 5;
  float z = 6;
  float dist = 7;
  uint32 trainer_id = 8;
  repeated TrainerSpell spells = 9;
}

message ClassTrainersResponse {
  repeated ClassTrainer trainers = 1;
}

message GameObjectRequest {
  uint32 entry = 1;
}

// gameobject_template row (chest data fields for type 3).
message GameObjectInfo {
  uint32 entry = 1;
  string name = 2;
  // 3 = chest (herbs and veins too: their lock needs a profession).
  uint32 type = 3;
  // Lock.dbc id (Data0), loot id (Data1) and the quest it needs (Data8) for a chest.
  uint32 lock_id = 4;
  uint32 loot_id = 5;
  uint32 quest_id = 6;
  // Loot entries anyone gets (QuestRequired = 0): crates have a few, treasure chests tens.
  uint32 loot_items = 7;
}

service World {
  rpc ItemSources(ItemSourcesRequest) returns (ItemSourcesResponse);
  rpc FindNpc(FindNpcRequest) returns (FindNpcResponse);
  rpc QuestInfo(QuestInfoRequest) returns (QuestInfoResponse);
  rpc QuestsForNpc(QuestsForNpcRequest) returns (QuestsForNpcResponse);
  rpc Spawns(SpawnsRequest) returns (SpawnsResponse);
  rpc ItemInfo(ItemInfoRequest) returns (ItemInfoResponse);
  rpc Creature(CreatureInfoRequest) returns (CreatureInfo);
  rpc ClassTrainers(ClassTrainersRequest) returns (ClassTrainersResponse);
  rpc GameObject(GameObjectRequest) returns (GameObjectInfo);
  rpc BeforeLogout(google.protobuf.Empty) returns (google.protobuf.Empty);
}
