syntax = "proto3";

package wowagent.auto.v1;
option go_package = "wowagent/gen/autov1;autov1";

import "api/module/v1/session.proto";
import "google/protobuf/empty.proto";

message RunRequest {
  // Skip gear/talents/training between quests (they run by default).
  bool no_progress = 4;
  // Quest ids to complete in order (accept, objectives, turn in).
  repeated uint32 quests = 1;
  // Reward choice index per quest id (default 0).
  map<uint32, uint32> rewards = 2;
  // Seconds to block before returning the status (default 20, max 25).
  uint32 wait_s = 3;
}

message StatusRequest {
  uint32 wait_s = 1;
}

message GrindRequest {
  // Creature entries to hunt in turn (4 kills each), e.g. the monsters around the character.
  repeated uint32 entries = 1;
  // Stop when the character reaches this level.
  uint32 until_level = 2;
  // Seconds to block before returning the status (default 20, max 25).
  uint32 wait_s = 3;
  // Time limit of the whole grind (default 1500 s).
  uint32 max_s = 4;
}

message AutoStatus {
  // idle | running | done | failed | stopped
  string state = 1;
  string reason = 2;
  uint32 quest = 3;
  string step = 4;
  repeated uint32 done = 5;
  uint32 level = 6;
  uint32 xp = 7;
  uint32 elapsed_s = 8;
  // Gear, talents, training and reward choices made during the run (last 10).
  repeated string progress = 9;
}

service Auto {
  rpc Recover(StatusRequest) returns (AutoStatus);
  rpc OnPacket(agentwow.module.v1.WorldPacket) returns (google.protobuf.Empty);
  rpc Run(RunRequest) returns (AutoStatus);
  rpc Grind(GrindRequest) returns (AutoStatus);
  rpc Status(StatusRequest) returns (AutoStatus);
  rpc Stop(google.protobuf.Empty) returns (AutoStatus);
  rpc BeforeLogout(google.protobuf.Empty) returns (google.protobuf.Empty);
}
