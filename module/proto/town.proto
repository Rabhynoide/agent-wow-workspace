syntax = "proto3";

package wowagent.town.v1;
option go_package = "wowagent/gen/townv1;townv1";

import "api/module/v1/session.proto";
import "google/protobuf/empty.proto";

message SellRequest {
  // Only report what would be sold and kept (with prices and reasons).
  bool dry_run = 1;
  // Stop selling once this many bag slots are free (0 = sell everything the rules allow).
  uint32 min_free = 2;
  // Include the kept items (with the reason) in the report.
  bool show_kept = 3;
}

message SellLine {
  uint32 entry = 1;
  string name = 2;
  uint32 count = 3;
  // Vendor price of the whole stack.
  uint32 copper = 4;
  // "sell" or "keep".
  string action = 5;
  string reason = 6;
}

message SellResult {
  bool ok = 1;
  string reason = 2;
  // Stacks sold (or to sell with dry_run).
  uint32 sold = 3;
  // Copper gained (or expected with dry_run).
  uint32 copper = 4;
  uint32 free_slots = 5;
  string vendor = 6;
  repeated SellLine lines = 7;
}

message RepairResult {
  bool ok = 1;
  string reason = 2;
  // Copper spent.
  uint32 copper = 3;
  uint32 durability_pct = 4;
  string vendor = 5;
}

message RestockRequest {
  // Wanted number of food items (spell category 11) and drinks (59) usable at our level in the bags.
  uint32 food = 1;
  uint32 drink = 2;
  // Spending limit in copper (0 = a third of our money).
  uint32 max_copper = 3;
  // Wanted number of healing potions (spell category 4 with a heal effect).
  uint32 potions = 4;
}

message BuyLine {
  uint32 entry = 1;
  string name = 2;
  uint32 count = 3;
  uint32 copper = 4;
}

message RestockResult {
  bool ok = 1;
  string reason = 2;
  repeated BuyLine bought = 3;
  // Copper spent (from the money before and after).
  uint32 copper = 4;
  string vendor = 5;
}

message RoomRequest {
  // The item about to be taken (looted or a quest reward) and its count; entry 0 = make room
  // whatever comes (a quest reward chosen by its value).
  uint32 entry = 1;
  uint32 count = 2;
}

message RoomResult {
  // There is room now (a free slot, a stack to add to, or a stack thrown away).
  bool ok = 1;
  string reason = 2;
  // The stack thrown away (0 = none) and its vendor price.
  uint32 destroyed = 3;
  uint32 destroyed_copper = 4;
  uint32 free_slots = 5;
}

service Town {
  rpc SellJunk(SellRequest) returns (SellResult);
  // Repairs all items at a repair vendor within 5 yards.
  rpc Repair(google.protobuf.Empty) returns (RepairResult);
  // Buys food and drink at the vendor within 5 yards (best usable at our level, within budget).
  rpc Restock(RestockRequest) returns (RestockResult);
  // Room for an item when the bags are full: throws away the cheapest stack the sell rules would
  // sell, if the item is worth more (or is a quest item, an upgrade, rare or better).
  rpc MakeRoom(RoomRequest) returns (RoomResult);
  rpc OnPacket(agentwow.module.v1.WorldPacket) returns (google.protobuf.Empty);
  rpc BeforeLogout(google.protobuf.Empty) returns (google.protobuf.Empty);
}
