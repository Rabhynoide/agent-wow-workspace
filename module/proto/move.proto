syntax = "proto3";

package wowagent.move.v1;
option go_package = "wowagent/gen/movev1;movev1";

import "google/protobuf/empty.proto";

message GotoRequest {
  float x = 1;
  float y = 2;
  float z = 3;
  // Arrival tolerance in yards (horizontal). Default 1.5.
  float radius = 4;
  // Max seconds to block waiting for the result (default 20, max 25). The job keeps running afterwards.
  uint32 wait_s = 5;
  // Walk instead of run.
  bool walk = 6;
}

message StatusRequest {
  // Block up to this many seconds for the job to finish (max 25).
  uint32 wait_s = 1;
}

message MoveStatus {
  // idle | moving | arrived | failed | stopped
  string state = 1;
  string reason = 2;
  float x = 3;
  float y = 4;
  float z = 5;
  float o = 6;
  float dist_left = 7;
  float eta_s = 8;
  float elapsed_s = 9;
  float path_len = 10;
}

message PathRequest {
  float x = 1;
  float y = 2;
  float z = 3;
}

message PathResponse {
  uint32 points = 1;
  float length = 2;
  string error = 3;
}

message LosRequest {
  // Target position (world); the check runs from our eyes to the target's (+2 yards each).
  float x = 1;
  float y = 2;
  float z = 3;
}

message LosResult {
  bool visible = 1;
  string reason = 2;
}

message SafePointRequest {
  // Center of the search (e.g. our corpse); points within max_dist of it (default 30).
  float x = 1;
  float y = 2;
  float z = 3;
  float max_dist = 4;
  float min_dist = 5;
  // Also keep the walk there away from monsters (alive character); a ghost can ignore it.
  bool path_clear = 6;
}

message SafePointResult {
  bool ok = 1;
  string reason = 2;
  float x = 3;
  float y = 4;
  float z = 5;
  // Distance from the point (and from the path with path_clear) to the nearest hostile monster.
  float clearance = 6;
  uint32 threats = 7;
}

service Move {
  rpc Goto(GotoRequest) returns (MoveStatus);
  rpc Status(StatusRequest) returns (MoveStatus);
  rpc Stop(google.protobuf.Empty) returns (MoveStatus);
  rpc Path(PathRequest) returns (PathResponse);
  rpc LineOfSight(LosRequest) returns (LosResult);
  // Point near (x, y, z) farthest from the hostile monsters we see, reachable on foot.
  rpc SafePoint(SafePointRequest) returns (SafePointResult);
  rpc BeforeLogout(google.protobuf.Empty) returns (google.protobuf.Empty);
}
