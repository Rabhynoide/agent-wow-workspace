syntax = "proto3";

package wowagent.quest.v1;
option go_package = "wowagent/gen/questv1;questv1";

import "api/module/v1/session.proto";
import "google/protobuf/empty.proto";

message QuestResult {
  bool ok = 1;
  string reason = 2;
  // Items looted (for Use with loot) as "entry" ids.
  repeated uint32 items = 3;
}

message AcceptRequest {
  uint32 npc_entry = 1;
  uint32 quest_id = 2;
}

message TurnInRequest {
  uint32 npc_entry = 1;
  uint32 quest_id = 2;
  // Index of the chosen reward among the choice items (0 when none).
  uint32 reward = 3;
}

message UseRequest {
  uint32 entry = 1;
  // Take all loot opened by the object.
  bool loot = 2;
  // This object (0: the nearest with the entry).
  uint64 guid = 3;
  // Spell that opens its lock (quest.chests); 0 = use it, then cast 22810 when it is locked.
  uint32 open_spell = 4;
}

message ChestsRequest {
  float radius = 1;
}

// A chest in sight that any character opens (no key, profession or quest needed).
message Chest {
  uint64 guid = 1;
  uint32 entry = 2;
  string name = 3;
  float x = 4;
  float y = 5;
  float z = 6;
  float dist = 7;
  // 0 = no lock (plain use).
  uint32 open_spell = 8;
  uint32 loot_items = 9;
}

message ChestsResponse {
  repeated Chest chests = 1;
}

message ExploreRequest {
  // Area trigger id (world.quest_info objective "explore"); the character must stand inside it.
  uint32 trigger = 1;
}

message UseItemRequest {
  // Bag item to use (its on-use spell).
  uint32 item_entry = 1;
  // Target: nearest visible creature or gameobject (target_kind "unit" or "gameobject") with this
  // entry within 40 yards; 0 = no target (spell on self or around).
  uint32 target_entry = 2;
  string target_kind = 3;
  // The item's on-use spell (the server checks it); 0 = looked up with world.item_info.
  uint32 spell = 4;
}

service Quest {
  rpc Accept(AcceptRequest) returns (QuestResult);
  rpc TurnIn(TurnInRequest) returns (QuestResult);
  rpc Use(UseRequest) returns (QuestResult);
  rpc Explore(ExploreRequest) returns (QuestResult);
  rpc UseItem(UseItemRequest) returns (QuestResult);
  rpc Chests(ChestsRequest) returns (ChestsResponse);
  rpc OnPacket(agentwow.module.v1.WorldPacket) returns (google.protobuf.Empty);
  rpc BeforeLogout(google.protobuf.Empty) returns (google.protobuf.Empty);
}
