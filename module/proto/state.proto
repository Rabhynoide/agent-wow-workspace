syntax = "proto3";

package wowagent.state.v1;
option go_package = "wowagent/gen/statev1;statev1";

import "api/module/v1/session.proto";
import "google/protobuf/empty.proto";

// One aura (buff or debuff) on a unit, from SMSG_AURA_UPDATE(_ALL).
message Aura {
  uint32 slot = 1;
  uint32 spell = 2;
  // Stack count, or charges for auras without stacks.
  uint32 stacks = 3;
  // Remaining and full duration in milliseconds (0 = no duration sent).
  uint32 left_ms = 4;
  uint32 max_ms = 5;
  // Cast by us.
  bool mine = 6;
  bool positive = 7;
}

message SelfInfo {
  uint64 guid = 1;
  uint32 map = 2;
  float x = 3;
  float y = 4;
  float z = 5;
  float o = 6;
  uint32 level = 7;
  uint32 hp = 8;
  uint32 max_hp = 9;
  uint32 power = 10;
  uint32 max_power = 11;
  uint32 power_type = 12;
  uint32 xp = 13;
  uint32 next_xp = 14;
  uint32 money = 15;
  uint64 target = 16;
  bool dead = 17;
  float run_speed = 18;
  uint32 unit_flags = 19;
  bool ghost = 20;
  uint32 class_id = 21;
  uint32 race = 22;
  // Unspent talent points.
  uint32 talent_points = 23;
  // UNIT_FIELD_AURASTATE: bit (state-1) set when a spell condition holds (Spell.dbc CasterAuraState:
  // 10 = Victory Rush usable, 1 = Revenge/defense, ...).
  uint32 aura_state = 24;
  repeated Aura auras = 25;
  // Armor (UNIT_FIELD_RESISTANCES[0]): the damage monsters deal us is learned before it (combat/dpslearn.go).
  uint32 armor = 26;
}

message Item {
  int32 slot = 1;
  uint32 entry = 2;
  uint32 count = 3;
  uint64 guid = 4;
  uint64 container = 5;
  // Position for item packets: bag 255 = backpack/equipment (bag_slot = inventory slot),
  // 19..22 = equipped bag (bag_slot = index in that bag). Unset (0/0) for bank items.
  uint32 bag = 6;
  uint32 bag_slot = 7;
  // Current and maximum durability (0/0 for items that do not wear).
  uint32 durability = 8;
  uint32 max_durability = 9;
}

message Quest {
  uint32 id = 1;
  uint32 state = 2;
  repeated uint32 counts = 3;
}

message SnapshotResponse {
  SelfInfo self = 1;
  repeated Item items = 2;
  repeated Quest quests = 3;
  uint32 objects = 4;
  uint32 packets = 5;
  // Empty slots in the backpack and equipped bags.
  uint32 free_slots = 6;
  // Lowest durability of the equipped items, in percent (100 when nothing can wear out).
  uint32 durability_pct = 7;
}

// Brief is a light snapshot without the item list.
message BriefResponse {
  SelfInfo self = 1;
  repeated Quest quests = 2;
  uint32 free_slots = 3;
  uint32 durability_pct = 4;
}

message NearbyRequest {
  // "unit" (default), "gameobject", "player" or "any".
  string kind = 1;
  uint32 entry = 2;
  float radius = 3;
  // Default 5.
  uint32 max = 4;
  bool alive_only = 5;
  // Keep only units whose npc_flags intersect this mask.
  uint32 npc_flags = 6;
  // Keep only units hostile to us (they attack on sight), from FactionTemplate.dbc.
  bool hostile_only = 7;
  // Include each unit's auras (debuffs on a target: Rend, Shadow Word: Pain...).
  bool with_auras = 8;
}

message Obj {
  uint64 guid = 1;
  uint32 entry = 2;
  string kind = 3;
  float x = 4;
  float y = 5;
  float z = 6;
  float dist = 7;
  uint32 level = 8;
  uint32 hp = 9;
  uint32 max_hp = 10;
  uint32 faction = 11;
  uint32 unit_flags = 12;
  uint32 npc_flags = 13;
  uint32 dyn_flags = 14;
  uint64 target = 15;
  // Reaction to us: "hostile" (attacks on sight), "neutral" (attackable), "friendly"; "" if unknown.
  string reaction = 16;
  // UNIT_FIELD_AURASTATE (2 = health below 20 %: Execute usable).
  uint32 aura_state = 17;
  // Only with NearbyRequest.with_auras.
  repeated Aura auras = 18;
  // Distance to where a moving monster is now, along its move (x, y, z and dist give its
  // destination, as the server will place it): the spell range checks use both.
  float dist_now = 19;
  // Moving transports (boats, zeppelins: game objects with UPDATEFLAG_TRANSPORT): time into their
  // path now (ms, the server's GetPathProgress plus the time since it was sent; modulo period) and
  // the path period (GAMEOBJECT_LEVEL).
  uint32 path_progress = 20;
  uint32 period = 21;
}

message NearbyResponse {
  repeated Obj objs = 1;
  uint32 total = 2;
}

message SetPosRequest {
  float x = 1;
  float y = 2;
  float z = 3;
  float o = 4;
  // 0 keeps the current map.
  uint32 map = 5;
}

message SpellsResponse {
  repeated uint32 spells = 1;
}

message GetObjRequest {
  uint64 guid = 1;
}

service State {
  rpc Snapshot(google.protobuf.Empty) returns (SnapshotResponse);
  rpc Brief(google.protobuf.Empty) returns (BriefResponse);
  rpc Nearby(NearbyRequest) returns (NearbyResponse);
  rpc GetObj(GetObjRequest) returns (Obj);
  rpc SetPos(SetPosRequest) returns (google.protobuf.Empty);
  rpc Spells(google.protobuf.Empty) returns (SpellsResponse);
  rpc OnPacket(agentwow.module.v1.WorldPacket) returns (google.protobuf.Empty);
  rpc BeforeLogout(google.protobuf.Empty) returns (google.protobuf.Empty);
}
